[project]
name = "centinela"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jamaav", email = "jaamavcode@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
centinela = "centinela:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]